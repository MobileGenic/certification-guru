    type: Button
  - event_bindings: {click: button_3_click}
    layout_properties: {grid_position: 'YEUUHP,LUJMFE'}
    name: button_3
    properties: {text: button_3}
    type: Button
  - event_bindings: {click: button_1_click}
    layout_properties: {grid_position: 'MSHRRB,QCPRDN'}
    name: button_1
    properties: {background: '#7a0606', foreground: '#ffffff', text: Ask Question}
    type: Button
  - layout_properties: {grid_position: 'OTINEK,KLZTLD'}
    name: text_box_1
